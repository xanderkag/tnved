# Caddy → FastAPI. Caddy остаётся внутри compose как WS-страховка
# (на этом приложении WS не используется, но правило skill — единый шаблон).

services:
  app:
    build:
      context: .
      args:
        LITE_MODE: ${LITE_MODE:-0}
    image: ${COMPOSE_PROJECT_NAME:-tnved}:latest
    container_name: ${COMPOSE_PROJECT_NAME:-tnved}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      TZ: Europe/Moscow
      LITE_MODE: ${LITE_MODE:-0}
      # Только наша модель: без адреса и имени compose не поднимет стек,
      # а сервис не стартует (адрес вне внутренней сети — тоже отказ).
      LLM_BASE_URL: ${LLM_BASE_URL:?задайте LLM_BASE_URL — адрес нашей модели}
      LLM_MODEL: ${LLM_MODEL:?задайте LLM_MODEL — имя нашей модели}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_KEY_FILE: ${LLM_API_KEY_FILE:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_SCHEMA_MAX_TOKENS: ${LLM_SCHEMA_MAX_TOKENS:-1400}
      # Векторы запросов — bge-m3 на нашем сервере, той же моделью, что собран
      # индекс (паспорт data/tnved_index_info.json). В полном режиме адрес
      # обязателен: без него сервис в degraded, /health — 503. Здесь без `:?` —
      # в LITE_MODE=1 векторы не нужны. EMBEDDER_BACKEND передаём, чтобы
      # local из .env дал отказ (в образе нет e5), а не молча сменился на api.
      EMBEDDER_BACKEND: ${EMBEDDER_BACKEND:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-m3}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_TIMEOUT: ${EMBEDDINGS_TIMEOUT:-30}
      # Уровень 1 — декларации холдинга. Файл — в ./incoming (в git и образ не входит),
      # путь внутри контейнера: /app/incoming/<файл>. Не задан — уровень выключен;
      # задан и не читается — сервис не стартует.
      DECLARATIONS_PATH: ${DECLARATIONS_PATH:-}
      DECLARATIONS_NEAR_MIN: ${DECLARATIONS_NEAR_MIN:-}
      DECLARATIONS_EXAMPLES: ${DECLARATIONS_EXAMPLES:-}
      DECLARATIONS_EXAMPLE_MIN: ${DECLARATIONS_EXAMPLE_MIN:-}
      # Прецеденты ФСА — позиции похожих товаров из реестров деклараций и сертификатов
      # соответствия, подсказка triage. Свод — тоже в ./incoming; не задан — выключено.
      PRECEDENTS_PATH: ${PRECEDENTS_PATH:-}
      PRECEDENTS_NEIGHBOURS: ${PRECEDENTS_NEIGHBOURS:-}
    volumes:
      - ./incoming:/app/incoming:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  caddy:
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tnved}-caddy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8110}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
